# Contenedor de DESARROLLO: hot-reload con la carpeta del proyecto montada.
# Cada guardado se refleja al instante en http://localhost (sin rebuild).
#
#   npm run dev:docker        -> levanta en segundo plano
#   npm run dev:docker:logs   -> ver el log del servidor
#   npm run dev:docker:down   -> detener
#
# Nota: usa el puerto 80 igual que producción, así que detén uno antes de
# levantar el otro (npm run prod:docker:down / npm run dev:docker:down).
services:
  web:
    image: node:24-alpine
    container_name: soyarquitectodigital-landing-dev
    working_dir: /app
    # Instala dependencias la primera vez y cada vez que cambia package-lock.json:
    # el volumen de node_modules vive aparte del proyecto y sin esta comprobación
    # se quedaba con las dependencias viejas (error 500 al añadir un paquete).
    command: >
      sh -c "hash=$(md5sum package-lock.json | cut -d' ' -f1);
             if [ ! -x node_modules/.bin/astro ] || [ "$hash" != "$(cat node_modules/.lock-hash 2>/dev/null)" ]; then
               echo 'Instalando dependencias...' && npm ci --no-audit --no-fund && echo "$hash" > node_modules/.lock-hash;
             fi;
             npm run dev -- --host 0.0.0.0 --port 80"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '${DEV_PORT:-80}:80'
      - '${DEV_ALT_PORT:-4321}:80'
    restart: unless-stopped

volumes:
  node_modules:

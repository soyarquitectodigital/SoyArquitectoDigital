server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # URLs limpias: sirve /ruta, /ruta/ y /ruta.html indistintamente
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Assets con hash de Astro: cache inmutable de 1 año
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Imágenes y fuentes estáticas
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 30d;
    }

    # XML/TXT (sitemap, robots, rss)
    location ~* \.(?:xml|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 1h;
    }

    # HTML siempre revalidado para publicar cambios sin purgar cachés
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires -1;
    }

    location = /404.html {
        internal;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    error_page 404 /404.html;
}
